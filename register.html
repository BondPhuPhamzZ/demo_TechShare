<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký - Tech Share</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body style="background-color: #f4f6f9">
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Tech Share</a>
      </div>
    </nav>

    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="bg-white border rounded p-4 shadow-sm">
            <h4 class="text-center mb-4">Đăng ký tài khoản sinh viên</h4>
            <p class="text-center text-muted">
              Tài khoản này dùng chung cho cả việc mượn đồ và đăng cho thuê đồ.
            </p>
            <form action="login.html">
              <div class="mb-3">
                <label class="form-label fw-bold">Họ và tên</label>
                <input
                  type="text"
                  class="form-control"
                  placeholder="Nhập đầy đủ họ tên"
                  required
                />
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label fw-bold">Mã số sinh viên</label>
                  <input
                    type="text"
                    class="form-control"
                    placeholder="VD: 20110000"
                    required
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label fw-bold">Số điện thoại</label>
                  <input
                    type="tel"
                    class="form-control"
                    placeholder="Nhập số Zalo/SĐT"
                    required
                  />
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold"
                  >Email trường cấp (@student.edu.vn)</label
                >
                <input
                  type="email"
                  class="form-control"
                  placeholder="Sử dụng email trường để xác thực"
                  required
                />
                <div class="form-text text-danger" style="font-size: 13px">
                  Bắt buộc dùng email trường để tăng độ uy tín.
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">Mật khẩu</label>
                <input
                  type="password"
                  class="form-control"
                  placeholder="Nhập mật khẩu"
                  required
                />
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">Nhập lại mật khẩu</label>
                <input
                  type="password"
                  class="form-control"
                  placeholder="Xác nhận mật khẩu"
                  required
                />
              </div>

              <div class="mb-3 form-check">
                <input
                  type="checkbox"
                  class="form-check-input"
                  id="agreeTerms"
                  required
                />
                <label class="form-check-label" for="agreeTerms"
                  >Tôi đồng ý với các quy định hệ thống.</label
                >
              </div>

              <button type="submit" class="btn btn-primary w-100 mb-3">
                Tạo tài khoản
              </button>

              <div class="text-center">
                <span>Đã có tài khoản? </span
                ><a href="login.html" class="text-decoration-none"
                  >Đăng nhập ngay</a
                >
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
